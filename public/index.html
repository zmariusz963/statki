<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Statki</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0c1219" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Statki" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="btn-mute" aria-label="Wlacz/wylacz dzwiek">&#128266;</button>
<button id="btn-fullscreen" aria-label="Pelny ekran">&#9974;</button>
<audio id="bg-music" src="muzyka.mp3" loop preload="none"></audio>

<div id="screen-lobby" class="screen">
  <h1>Statki</h1>
  <button id="btn-create">Zagraj online (2 urzadzenia)</button>
  <div class="divider">albo</div>
  <input id="input-code" placeholder="Kod pokoju" maxlength="4" autocapitalize="characters" />
  <button id="btn-join">Dolacz do pokoju</button>
  <div class="divider">albo</div>
  <button id="btn-mode-1v1">Gracz vs Gracz (jeden telefon)</button>
  <button id="btn-mode-1vai">Gracz vs Komputer</button>
  <button id="btn-mode-2vai">2 Gracze vs 2 Komputer</button>
  <p id="lobby-message" class="message"></p>
</div>

<div id="screen-online-mode" class="screen hidden">
  <h1>Jaki tryb online?</h1>
  <p class="hint">Kazdy gracz dolacza na swoim urzadzeniu przez kod pokoju.</p>
  <button id="btn-online-1v1">Gracz vs Gracz</button>
  <button id="btn-online-2v2">2 Gracze vs 2 Gracze</button>
  <button id="btn-online-2vai">2 Gracze vs Komputer</button>
</div>

<div id="screen-waiting" class="screen hidden">
  <h1>Pokoj utworzony</h1>
  <p>Podaj ten kod pozostalym graczom:</p>
  <div id="room-code" class="room-code"></div>
  <p id="waiting-hint" class="hint">Czekam na dolaczenie graczy...</p>
</div>

<div id="screen-pass" class="screen hidden">
  <h1 id="pass-title"></h1>
  <p id="pass-message" class="hint"></p>
  <button id="btn-pass-continue">Dalej</button>
</div>

<div id="screen-place" class="screen hidden">
  <h2>Rozstaw swoje statki</h2>
  <p id="place-hint" class="hint"></p>
  <div id="ships-legend" class="ships-legend"></div>
  <div class="place-controls">
    <button id="btn-rotate">Obroc statek</button>
    <button id="btn-mirror">Odbij statek</button>
    <button id="btn-undo">Cofnij</button>
  </div>
  <div id="shape-picker" class="shape-picker hidden"></div>
  <div id="place-board"></div>
  <button id="btn-ready" class="hidden">Gotowy</button>
  <p id="place-message" class="message"></p>
</div>

<div id="screen-game" class="screen hidden">
  <p id="turn-indicator" class="turn-indicator"></p>
  <div class="boards-wrap">
    <div class="board-col">
      <h3 id="enemy-board-title">Przeciwnik</h3>
      <div id="enemy-board"></div>
    </div>
    <div class="board-col">
      <h3 id="own-board-title">Ty</h3>
      <div class="own-board-row">
        <div id="own-board"></div>
        <table class="sunk-tally-table">
          <tbody id="sunk-tally"></tbody>
        </table>
      </div>
    </div>
  </div>
  <p id="game-message" class="message"></p>
</div>

<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
