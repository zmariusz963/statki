<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Statki</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<button id="btn-mute" aria-label="Wlacz/wylacz dzwiek">&#128266;</button>

<div id="screen-lobby" class="screen">
  <h1>Statki</h1>
  <button id="btn-create">Stworz pokoj (online)</button>
  <div class="divider">albo</div>
  <input id="input-code" placeholder="Kod pokoju" maxlength="4" autocapitalize="characters" />
  <button id="btn-join">Dolacz do pokoju</button>
  <div class="divider">albo</div>
  <button id="btn-local">Graj na jednym telefonie</button>
  <p id="lobby-message" class="message"></p>
</div>

<div id="screen-waiting" class="screen hidden">
  <h1>Pokoj utworzony</h1>
  <p>Podaj ten kod drugiemu graczowi:</p>
  <div id="room-code" class="room-code"></div>
  <p class="hint">Czekam na dolaczenie gracza...</p>
</div>

<div id="screen-pass" class="screen hidden">
  <h1 id="pass-title"></h1>
  <p id="pass-message" class="hint"></p>
  <button id="btn-pass-continue">Dalej</button>
</div>

<div id="screen-place" class="screen hidden">
  <h2>Rozstaw swoje statki</h2>
  <p id="place-hint" class="hint"></p>
  <div id="ships-legend" class="ships-legend"></div>
  <div class="place-controls">
    <button id="btn-rotate">Obroc statek</button>
    <button id="btn-mirror">Odbij statek</button>
    <button id="btn-undo">Cofnij</button>
  </div>
  <div id="place-board"></div>
  <button id="btn-ready" class="hidden">Gotowy</button>
  <p id="place-message" class="message"></p>
</div>

<div id="screen-game" class="screen hidden">
  <p id="turn-indicator" class="turn-indicator"></p>
  <div class="boards-wrap">
    <div class="board-col">
      <h3>Przeciwnik</h3>
      <div id="enemy-board"></div>
    </div>
    <div class="board-col">
      <h3>Ty</h3>
      <div id="own-board"></div>
    </div>
  </div>
  <p id="game-message" class="message"></p>
</div>

<script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0000_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0400_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0420_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0430_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0560_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0600_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0570_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0470_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0210_FluidR3_GM_sf2_file.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0190_FluidR3_GM_sf2_file.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
